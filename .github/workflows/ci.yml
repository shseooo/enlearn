name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # scripts/build-corpus.mts가 .mts + .ts 확장자 import(타입 스트리핑)를 사용한다
          node-version: "24"
          cache: npm
      - run: npm ci
      # Next 16은 LayoutProps 같은 타입을 .next/types에 생성한다(next-env.d.ts가 참조).
      # 이 단계가 없으면 클린 체크아웃에서 typecheck만 깨진다.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
